name: Build SIGYI APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sigyi-apk-build-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_VERSION: "8.11.1"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.0.12077973"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build debug and release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          test -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify Android build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "${SDK_ROOT}"
          java -version
          gradle --version
          test -d "${SDK_ROOT}/platforms/${ANDROID_PLATFORM}"
          test -d "${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          test -d "${SDK_ROOT}/cmake/${CMAKE_VERSION}"

      - name: Run Gradle checks
        run: gradle --no-daemon --stacktrace :app:check

      - name: Build debug and test-release APKs
        run: |
          gradle --no-daemon --stacktrace \
            :app:assembleDebug \
            :app:assembleRelease

      - name: List generated APKs
        shell: bash
        run: |
          set -euo pipefail
          find app/build/outputs/apk -type f -name "*.apk" -print -exec ls -lh {} \;

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sigyi-recap-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: sigyi-recap-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload mapping files when available
        uses: actions/upload-artifact@v4
        with:
          name: sigyi-recap-build-reports
          path: |
            app/build/reports/**
            app/build/outputs/mapping/**
          if-no-files-found: ignore
          retention-days: 14
